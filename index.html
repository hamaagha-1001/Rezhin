<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ڕێژین🤍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            direction: rtl;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 400px;
            animation: fadeIn 2s ease-in-out;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .heart-icon {
            font-size: 50px;
            color: #ff477e;
            animation: beat 1.2s infinite;
            margin-bottom: 15px;
        }

        /* ئەنیمەیشنی لێدانی دڵ */
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    
        .bg-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.2);
            font-size: 20px;
            animation: float 6s linear infinite;
            bottom: -50px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-hearts">
        <span class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</span>
        <span class="floating-heart" style="left: 25%; animation-delay: 2s; font-size: 30px;">🤍</span>
        <span class="floating-heart" style="left: 40%; animation-delay: 4s;">❤️</span>
        <span class="floating-heart" style="left: 60%; animation-delay: 1s; font-size: 25px;">🤍</span>
        <span class="floating-heart" style="left: 75%; animation-delay: 3s;">❤️</span>
        <span class="floating-heart" style="left: 90%; animation-delay: 5s;">🤍</span>
    </div>

    <div class="card">
        <div class="heart-icon">🤍</div>
        <h1>Rezhin 🤍
    </div>

</body>
</html>
